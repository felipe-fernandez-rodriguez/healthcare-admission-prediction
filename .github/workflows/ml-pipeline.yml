name: ML Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  contents: write

concurrency:
  group: ml-pipeline-main
  cancel-in-progress: false

env:
  # Opcional: el dataset es público; el secreto solo evita límites de uso anónimo.
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  # Límite de seguridad por archivo generado (GitHub avisa a 50 MB y bloquea a 100 MB).
  MAX_FILE_MB: "50"

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Registrar kernel de Jupyter
        run: python -m ipykernel install --user --name python3

      - name: Ejecutar pipeline completo (script)
        run: python -m src.pipeline

      - name: Ejecutar notebook 01 - ingestión
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 notebooks/01-data-ingestion.ipynb

      - name: Ejecutar notebook 02 - regresión lineal
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 notebooks/02-model-linear-regresion.ipynb

      - name: Ejecutar notebook 03 - clasificación
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 notebooks/03-model-clasification.ipynb

      - name: Verificar reportes y tamaño de archivos generados
        run: |
          test -s reports/data-summary.txt || { echo "Falta reports/data-summary.txt"; exit 1; }
          test -s reports/model-summary.txt || { echo "Falta reports/model-summary.txt"; exit 1; }
          big=$(find data models reports notebooks -type f -size +${MAX_FILE_MB}M)
          if [ -n "$big" ]; then
            echo "Archivos que superan ${MAX_FILE_MB} MB:"; echo "$big"; exit 1
          fi
          du -sh data models reports notebooks

      - name: Publicar reportes como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reportes-ml
          path: |
            reports/data-summary.txt
            reports/model-summary.txt
          if-no-files-found: error

      - name: Confirmar archivos generados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports models notebooks

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: actualizar datos, modelos y reportes [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
